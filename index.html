<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>여백 서재</title>
  
  <!-- PWA / iOS WebApp Meta -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#1a1c23">
  <link rel="apple-touch-icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512' fill='%232c3e50'><rect width='512' height='512' rx='120' fill='%231a1c23'/><path d='M160 120h192v272H160z' fill='%23d4af37' opacity='0.2'/><path d='M180 140h152v232H180z' fill='%23f4efe6'/><path d='M210 180h92M210 220h92M210 260h60' stroke='%234a3b32' stroke-width='12' stroke-linecap='round'/></svg>">

  <!-- External Parsers -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #181a20 0%, #242834 50%, #1a1c24 100%);
      --glass-bg: rgba(255, 255, 255, 0.07);
      --glass-border: rgba(255, 255, 255, 0.12);
      --text-main: #2c221e;
      --text-sub: #7a6e65;
      --reader-bg: #f7f4ed;
      --accent: #c5a059;
      --accent-hover: #dfb76c;
      --safe-top: env(safe-area-inset-top, 20px);
      --safe-bottom: env(safe-area-inset-bottom, 20px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      overflow: hidden;
      background: #121318;
      color: #fff;
    }

    /* 화면 스위칭 레이아웃 */
    .app-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: none;
      flex-direction: column;
      opacity: 0;
      transition: opacity 0.35s ease;
      background: var(--bg-gradient);
    }

    .app-screen.active {
      display: flex;
      opacity: 1;
      z-index: 10;
    }

    /* -------------------------------------------------------------
       1. 초기 화면 (홈) - 프라이버시 보장 & 고급 아치 일러스트 아트워크
    ------------------------------------------------------------- */
    #screen-home {
      justify-content: space-between;
      align-items: center;
      padding: calc(var(--safe-top) + 20px) 24px calc(var(--safe-bottom) + 30px);
      text-align: center;
      background: radial-gradient(circle at 50% 30%, #2d3245 0%, #15171e 80%);
    }

    .home-header {
      margin-top: 10px;
    }

    .app-title {
      font-family: "Nanum Myeongjo", "Batang", serif;
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      color: #f3ece0;
      text-shadow: 0 4px 20px rgba(0,0,0,0.6);
    }

    .app-subtitle {
      font-size: 0.85rem;
      letter-spacing: 0.3em;
      color: var(--accent);
      margin-top: 6px;
      text-transform: uppercase;
      opacity: 0.9;
    }

    /* 아치형 서재 감성 아트워크 */
    .illustration-container {
      width: 100%;
      max-width: 320px;
      height: 42vh;
      margin: 10px 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .arch-artwork {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 15px 35px rgba(0,0,0,0.5));
    }

    /* 홈 하단 전용 아이콘 버튼 바 (설명 텍스트 완전 배제) */
    .home-nav-bar {
      display: flex;
      gap: 20px;
      background: rgba(255, 255, 255, 0.08);
      padding: 12px 28px;
      border-radius: 40px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }

    .icon-btn {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: none;
      background: rgba(255, 255, 255, 0.1);
      color: #f0e6d2;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .icon-btn:active {
      transform: scale(0.92);
      background: var(--accent);
      color: #121318;
    }

    .icon-btn svg {
      width: 24px;
      height: 24px;
      fill: currentColor;
    }

    /* -------------------------------------------------------------
       2. 서재 화면 (읽는 중 / 다 읽음 탭 & 2줄 제목)
    ------------------------------------------------------------- */
    #screen-library {
      padding: calc(var(--safe-top) + 15px) 20px calc(var(--safe-bottom) + 20px);
      background: linear-gradient(180deg, #1e222d 0%, #14161d 100%);
    }

    .library-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .library-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: #f0e6d2;
      font-family: serif;
    }

    /* 탭 컨트롤 */
    .tab-bar {
      display: flex;
      background: rgba(0, 0, 0, 0.3);
      padding: 4px;
      border-radius: 12px;
      margin-bottom: 20px;
      border: 1px solid rgba(255,255,255,0.05);
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      border: none;
      background: transparent;
      color: #8a8f9d;
      font-size: 0.9rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    .book-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-bottom: 20px;
    }

    .book-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      backdrop-filter: blur(10px);
    }

    .book-info {
      flex: 1;
      margin-right: 12px;
      cursor: pointer;
    }

    /* 제목 최대 두 줄 표시 처리 */
    .book-name {
      font-size: 1.05rem;
      font-weight: 600;
      color: #e6dfd5;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-overflow: ellipsis;
      word-break: break-all;
    }

    .book-meta {
      font-size: 0.75rem;
      color: #8a8a8a;
      margin-top: 6px;
    }

    .delete-btn {
      background: transparent;
      border: none;
      color: #ff6b6b;
      padding: 8px;
      cursor: pointer;
      opacity: 0.7;
    }

    .delete-btn:hover { opacity: 1; }

    /* -------------------------------------------------------------
       3. 독서 본문 화면 & 밀레니엄 서식
    ------------------------------------------------------------- */
    #screen-reader {
      background: var(--reader-bg);
      color: var(--text-main);
      position: relative;
    }

    .reader-scroll-area {
      width: 100%;
      height: 100%;
      overflow-y: auto;
      padding: calc(var(--safe-top) + 30px) 24px calc(var(--safe-bottom) + 80px);
      scroll-behavior: smooth;
    }

    /* 세련된 배경 일러스트 투명 처리 */
    .reader-bg-artwork {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 80%;
      max-width: 400px;
      opacity: 0.04;
      pointer-events: none;
      z-index: 0;
    }

    .content-body {
      position: relative;
      z-index: 1;
      max-width: 680px;
      margin: 0 auto;
      line-height: 1.8;
      font-size: 1.1rem;
      word-break: break-word;
    }

    /* 문단, 대사, 제목 스타일링 */
    .content-body p {
      margin-bottom: 1.4em;
      text-align: justify;
    }

    .content-body .book-title-heading {
      font-size: 1.8rem;
      font-weight: 700;
      text-align: center;
      margin: 2em 0 1.5em;
      color: #1a1a1a;
      border-bottom: 2px solid var(--accent);
      padding-bottom: 0.5em;
    }

    .content-body .chapter-heading {
      font-size: 1.35rem;
      font-weight: 700;
      margin: 2.2em 0 1em;
      color: #3b2d25;
      border-left: 4px solid var(--accent);
      padding-left: 12px;
    }

    /* 대사 인용구 스타일 (지문과 자동 구분 강조) */
    .content-body blockquote.dialogue {
      margin: 1.2em 0;
      padding: 10px 16px;
      background: rgba(197, 160, 89, 0.08);
      border-left: 3px solid var(--accent);
      border-radius: 0 8px 8px 0;
      font-weight: 500;
      color: #1c1917;
    }

    /* 플로팅 메뉴 (하단 1개로 단일화 & 스크롤 오토 하이드) */
    .floating-menu {
      position: absolute;
      bottom: calc(var(--safe-bottom) + 16px);
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 16px;
      background: rgba(26, 28, 35, 0.92);
      padding: 10px 24px;
      border-radius: 30px;
      backdrop-filter: blur(15px);
      border: 1px solid rgba(255,255,255,0.15);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      transition: transform 0.3s ease, opacity 0.3s ease;
      z-index: 100;
    }

    .floating-menu.hidden {
      transform: translate(-50%, 100px);
      opacity: 0;
      pointer-events: none;
    }

    /* 설정 팝업 레이어 */
    .modal-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.6);
      display: none;
      justify-content: center;
      align-items: flex-end;
      z-index: 200;
    }

    .modal-overlay.active { display: flex; }

    .modal-card {
      width: 100%;
      max-width: 500px;
      background: #222530;
      border-radius: 24px 24px 0 0;
      padding: 24px 24px calc(var(--safe-bottom) + 24px);
      color: #fff;
      max-height: 80vh;
      overflow-y: auto;
    }

    .setting-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .setting-label { font-size: 0.95rem; color: #ccc; }

    .btn-group { display: flex; gap: 8px; }

    .opt-btn {
      padding: 6px 14px;
      border: 1px solid rgba(255,255,255,0.2);
      background: transparent;
      color: #fff;
      border-radius: 8px;
      cursor: pointer;
    }

    .opt-btn.active {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
    }

    /* 텍스트 붙여넣기 모달 */
    .paste-textarea {
      width: 100%;
      height: 200px;
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 12px;
      color: #fff;
      resize: none;
      margin: 12px 0;
    }

    /* 목차 리스트 모달 */
    .toc-item {
      padding: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      cursor: pointer;
      font-size: 0.95rem;
    }

    .toc-item:active { background: rgba(255,255,255,0.05); }

    /* 숨겨진 파일 인풋 */
    #file-input { display: none; }
  </style>
</head>
<body>

  <!-- =========================================================
       1. 초기 화면 (홈)
  ========================================================= -->
  <div id="screen-home" class="app-screen active">
    <div class="home-header">
      <h1 class="app-title">여백 서재</h1>
      <div class="app-subtitle">Yeobaek Seojae</div>
    </div>

    <!-- 고품격 서재 아치 일러스트 아트워크 -->
    <div class="illustration-container">
      <svg class="arch-artwork" viewBox="0 0 320 400" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="arch-grad" x1="0" y1="0" x2="0" y2="400" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#3a415a" />
            <stop offset="100%" stop-color="#1e212d" />
          </linearGradient>
          <linearGradient id="gold-light" x1="0" y1="0" x2="320" y2="400" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#dfb76c" stop-opacity="0.8"/>
            <stop offset="100%" stop-color="#c5a059" stop-opacity="0.2"/>
          </linearGradient>
        </defs>
        <!-- 아치 창문 -->
        <path d="M40 380 V160 A120 120 0 0 1 280 160 V380 Z" fill="url(#arch-grad)" stroke="url(#gold-light)" stroke-width="3"/>
        <path d="M60 380 V160 A100 100 0 0 1 260 160 V380 Z" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
        <!-- 달 / 조명 빛 -->
        <circle cx="160" cy="140" r="45" fill="#f4efe6" opacity="0.85"/>
        <circle cx="160" cy="140" r="65" fill="#f4efe6" opacity="0.15"/>
        <!-- 책장 선반 & 실루엣 -->
        <line x1="70" y1="260" x2="250" y2="260" stroke="#c5a059" stroke-width="4" stroke-linecap="round"/>
        <rect x="90" y="200" width="18" height="60" rx="2" fill="#c5a059" opacity="0.7"/>
        <rect x="112" y="215" width="14" height="45" rx="2" fill="#8a7343"/>
        <rect x="130" y="190" width="22" height="70" rx="2" fill="#e0c388" opacity="0.9"/>
        <rect x="180" y="210" width="16" height="50" rx="2" fill="#c5a059" opacity="0.6"/>
        <rect x="200" y="200" width="20" height="60" rx="2" fill="#8a7343"/>
        <!-- 김이 피어오르는 찻잔 -->
        <path d="M140 330 h40 v15 a20 20 0 0 1 -40 0 Z" fill="#f4efe6" opacity="0.9"/>
        <path d="M152 318 C150 310, 156 305, 154 298" stroke="#f4efe6" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
        <path d="M164 318 C162 310, 168 305, 166 298" stroke="#f4efe6" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
      </svg>
    </div>

    <!-- 하단 내비게이션 (설명 글자 없이 아이콘만 적용) -->
    <div class="home-nav-bar">
      <!-- 서재 이동 -->
      <button class="icon-btn" onclick="switchScreen('library')" title="서재">
        <svg viewBox="0 0 24 24"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H8V4h12v12z"/></svg>
      </button>
      <!-- 파일 열기 -->
      <button class="icon-btn" onclick="document.getElementById('file-input').click()" title="파일 열기">
        <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
      </button>
      <!-- 텍스트 붙여넣기 -->
      <button class="icon-btn" onclick="openModal('modal-paste')" title="텍스트 붙여넣기">
        <svg viewBox="0 0 24 24"><path d="M19 2h-4.18C14.4 1.84 13.3 1 12 1c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm7 18H5V4h2v3h10V4h2v16z"/></svg>
      </button>
    </div>
  </div>

  <!-- 숨겨진 파일 업로드 입력창 -->
  <input type="file" id="file-input" accept=".txt,.docx,.pdf,.epub,.md,.html" onchange="handleFileUpload(event)">

  <!-- =========================================================
       2. 서재 화면
  ========================================================= -->
  <div id="screen-library" class="app-screen">
    <div class="library-header">
      <button class="icon-btn" onclick="switchScreen('home')">
        <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      </button>
      <div class="library-title">나의 서재</div>
      <button class="icon-btn" onclick="document.getElementById('file-input').click()">
        <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
      </button>
    </div>

    <!-- 탭 선택 -->
    <div class="tab-bar">
      <button id="tab-reading" class="tab-btn active" onclick="switchTab('reading')">읽고 있는 책</button>
      <button id="tab-finished" class="tab-btn" onclick="switchTab('finished')">다 읽은 책</button>
    </div>

    <!-- 책 목록 -->
    <div id="book-list-container" class="book-list"></div>
  </div>

  <!-- =========================================================
       3. 본문 독서 화면
  ========================================================= -->
  <div id="screen-reader" class="app-screen">
    <div id="reader-scroll-area" class="reader-scroll-area" onscroll="handleScroll()">
      <!-- 은은한 투명도 배경 아트워크 -->
      <svg class="reader-bg-artwork" viewBox="0 0 200 200" fill="none">
        <circle cx="100" cy="100" r="80" stroke="#000" stroke-width="2" opacity="0.3"/>
        <path d="M60 140 C80 100, 120 100, 140 140" stroke="#000" stroke-width="2" opacity="0.3"/>
      </svg>
      
      <div id="content-body" class="content-body"></div>
    </div>

    <!-- 하단 단일 플로팅 메뉴바 (오토 하이드) -->
    <div id="floating-menu" class="floating-menu">
      <button class="icon-btn" onclick="switchScreen('library')" title="서재">
        <svg viewBox="0 0 24 24"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H8V4h12v12z"/></svg>
      </button>
      <button class="icon-btn" onclick="openModal('modal-toc')" title="목차">
        <svg viewBox="0 0 24 24"><path d="M3 9h14V7H3v2zm0 4h14v-2H3v2zm0 4h14v-2H3v2zm16 0h2v-2h-2v2zm0-10v2h2V7h-2zm0 6h2v-2h-2v2z"/></svg>
      </button>
      <button class="icon-btn" onclick="toggleTTS()" id="btn-tts" title="음성 읽기">
        <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
      </button>
      <button class="icon-btn" onclick="openModal('modal-settings')" title="설정">
        <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
      </button>
    </div>
  </div>

  <!-- =========================================================
       4. 모달 팝업 레이어들
  ========================================================= -->
  <!-- 텍스트 붙여넣기 모달 -->
  <div id="modal-paste" class="modal-overlay">
    <div class="modal-card">
      <h3 style="margin-bottom: 12px; color:var(--accent);">텍스트 직접 붙여넣기</h3>
      <input type="text" id="paste-title" placeholder="책 제목을 입력하세요" style="width:100%; padding:10px; background:rgba(0,0,0,0.3); border:1px solid #444; border-radius:8px; color:#fff; margin-bottom:8px;">
      <textarea id="paste-content" class="paste-textarea" placeholder="여기에 소설이나 본문 내용을 붙여넣으세요..."></textarea>
      <div style="display:flex; gap:10px; justify-content:flex-end;">
        <button class="opt-btn" onclick="closeModal('modal-paste')">취소</button>
        <button class="opt-btn active" onclick="savePastedText()">등록 및 읽기</button>
      </div>
    </div>
  </div>

  <!-- 독서 설정 모달 -->
  <div id="modal-settings" class="modal-overlay">
    <div class="modal-card">
      <h3 style="margin-bottom: 16px; color:var(--accent);">독서 환경 설정</h3>
      
      <div class="setting-row">
        <span class="setting-label">글꼴</span>
        <div class="btn-group">
          <button class="opt-btn active" onclick="setFont('sans')">고딕</button>
          <button class="opt-btn" onclick="setFont('serif')">명조</button>
        </div>
      </div>

      <div class="setting-row">
        <span class="setting-label">굵은 글씨 (볼드)</span>
        <div class="btn-group">
          <button id="btn-bold" class="opt-btn" onclick="toggleBold()">OFF</button>
        </div>
      </div>

      <div class="setting-row">
        <span class="setting-label">글자 크기</span>
        <div class="btn-group">
          <button class="opt-btn" onclick="changeFontSize(-1)">A-</button>
          <button class="opt-btn" onclick="changeFontSize(1)">A+</button>
        </div>
      </div>

      <div class="setting-row">
        <span class="setting-label">테마 모드</span>
        <div class="btn-group">
          <button class="opt-btn active" onclick="setTheme('light')">밝음</button>
          <button class="opt-btn" onclick="setTheme('dark')">나이트</button>
        </div>
      </div>

      <div style="text-align:right; margin-top:20px;">
        <button class="opt-btn active" onclick="closeModal('modal-settings')">확인</button>
      </div>
    </div>
  </div>

  <!-- 목차 모달 -->
  <div id="modal-toc" class="modal-overlay">
    <div class="modal-card">
      <h3 style="margin-bottom: 16px; color:var(--accent);">목차</h3>
      <div id="toc-list" style="max-height: 50vh; overflow-y:auto;"></div>
      <div style="text-align:right; margin-top:16px;">
        <button class="opt-btn" onclick="closeModal('modal-toc')">닫기</button>
      </div>
    </div>
  </div>

  <!-- =========================================================
       5. 핵심 자바스크립트 로직
  ========================================================= -->
  <script>
    // PDF.js 워커 설정
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    // 앱 상태 관리
    let books = JSON.parse(localStorage.getItem('yeobaek_books') || '[]');
    let currentBookId = null;
    let activeTab = 'reading';
    let lastScrollTop = 0;
    let ttsUtterance = null;
    let isBold = false;
    let fontSize = 1.1;

    // 화면 전환
    function switchScreen(screenId) {
      document.querySelectorAll('.app-screen').forEach(s => s.classList.remove('active'));
      const target = document.getElementById(`screen-${screenId}`);
      if (target) {
        target.classList.add('active');
      }
      if (screenId === 'library') {
        renderLibrary();
      }
      if (screenId !== 'reader' && window.speechSynthesis) {
        window.speechSynthesis.cancel();
      }
    }

    // 모달 관리
    function openModal(id) { document.getElementById(id).classList.add('active'); }
    function closeModal(id) { document.getElementById(id).classList.remove('active'); }

    /* -------------------------------------------------------------
       인코딩 호환 디코더 (UTF-8, CP949, ANSI)
    ------------------------------------------------------------- */
    function decodeArrayBuffer(buffer) {
      let text = '';
      try {
        const utf8Decoder = new TextDecoder('utf-8', { fatal: true });
        text = utf8Decoder.decode(buffer);
      } catch (e) {
        try {
          const cp949Decoder = new TextDecoder('euc-kr');
          text = cp949Decoder.decode(buffer);
        } catch (err) {
          const latinDecoder = new TextDecoder('ansi');
          text = latinDecoder.decode(buffer);
        }
      }
      return text;
    }

    /* -------------------------------------------------------------
       파일 업로드 처리기
    ------------------------------------------------------------- */
    async function handleFileUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const title = file.name.replace(/\.[^/.]+$/, "");
      let rawText = "";

      try {
        const ext = file.name.split('.').pop().toLowerCase();

        if (ext === 'txt' || ext === 'md' || ext === 'html') {
          const buffer = await file.arrayBuffer();
          rawText = decodeArrayBuffer(buffer);
          if (ext === 'html') {
            const doc = new DOMParser().parseFromString(rawText, 'text/html');
            rawText = doc.body.innerText || doc.body.textContent;
          }
        } else if (ext === 'pdf') {
          const buffer = await file.arrayBuffer();
          const pdf = await pdfjsLib.getDocument({ data: buffer }).promise;
          let extracted = "";
          for (let i = 1; i <= pdf.numPages; i++) {
            const page = await pdf.getPage(i);
            const textContent = await page.getTextContent();
            let lastY = null;
            textContent.items.forEach(item => {
              const currentY = item.transform[5];
              if (lastY !== null && Math.abs(currentY - lastY) > 8) {
                extracted += "\n";
              }
              extracted += item.str + " ";
              lastY = currentY;
            });
            extracted += "\n\n";
          }
          rawText = extracted;
        } else if (ext === 'docx') {
          const buffer = await file.arrayBuffer();
          const result = await mammoth.extractRawText({ arrayBuffer: buffer });
          rawText = result.value;
        } else {
          alert('지원하지 않는 파일 형식입니다.');
          return;
        }

        if (!rawText.trim()) {
          alert('본문 내용을 읽을 수 없습니다.');
          return;
        }

        saveBookToLibrary(title, rawText);
      } catch (err) {
        console.error(err);
        alert('파일을 여는 중 오류가 발생했습니다: ' + err.message);
      } finally {
        event.target.value = '';
      }
    }

    // 붙여넣기 저장
    function savePastedText() {
      const title = document.getElementById('paste-title').value.trim() || '무제 문서';
      const content = document.getElementById('paste-content').value.trim();
      if (!content) {
        alert('내용을 입력해주세요.');
        return;
      }
      saveBookToLibrary(title, content);
      closeModal('modal-paste');
      document.getElementById('paste-title').value = '';
      document.getElementById('paste-content').value = '';
    }

    // 서재에 책 저장
    function saveBookToLibrary(title, rawText) {
      const newBook = {
        id: Date.now(),
        title: title,
        content: rawText,
        scrollPos: 0,
        isFinished: false,
        createdAt: new Date().toLocaleDateString()
      };

      books.unshift(newBook);
      localStorage.setItem('yeobaek_books', JSON.stringify(books));
      openBook(newBook.id);
    }

    /* -------------------------------------------------------------
       지능형 대사/지문/챕터 분리 파서 (인용구 서식 적용)
    ------------------------------------------------------------- */
    function renderParsedBookContent(book) {
      const container = document.getElementById('content-body');
      container.innerHTML = '';

      // 책 제목
      const titleEl = document.createElement('h1');
      titleEl.className = 'book-title-heading';
      titleEl.innerText = book.title;
      container.appendChild(titleEl);

      const lines = book.content.split(/\r?\n/);
      let tocList = [];

      // 챕터 감지 정규식
      const chapterRegex = /^(제\s*\d+\s*[장화|편]|CHAPTER\s*\d+|\d+화|\d+\.\s+|프롤로그|에필로그)/i;

      lines.forEach((line, index) => {
        const trimmed = line.trim();
        if (!trimmed) return;

        // 챕터 제목 처리
        if (chapterRegex.test(trimmed)) {
          const chapEl = document.createElement('h2');
          chapEl.className = 'chapter-heading';
          chapEl.id = `chap-${index}`;
          chapEl.innerText = trimmed;
          container.appendChild(chapEl);
          tocList.push({ title: trimmed, id: `chap-${index}` });
          return;
        }

        // 대사 감지 ("...", '...', “...”)
        const dialogueRegex = /^["'“‘].*["'”’]$/;
        if (dialogueRegex.test(trimmed)) {
          const quoteEl = document.createElement('blockquote');
          quoteEl.className = 'dialogue';
          quoteEl.innerText = trimmed;
          container.appendChild(quoteEl);
        } else {
          // 일반 지문 문단
          const pEl = document.createElement('p');
          pEl.innerText = trimmed;
          container.appendChild(pEl);
        }
      });

      // 목차 생성
      renderTOC(tocList);

      // 이전 읽던 위치 복원
      setTimeout(() => {
        const scrollArea = document.getElementById('reader-scroll-area');
        scrollArea.scrollTop = book.scrollPos || 0;
      }, 100);
    }

    // 목차 리스트 출력
    function renderTOC(tocList) {
      const tocContainer = document.getElementById('toc-list');
      tocContainer.innerHTML = '';

      if (tocList.length === 0) {
        tocContainer.innerHTML = '<div style="color:#888; text-align:center; padding:20px;">자동 감지된 목차가 없습니다.</div>';
        return;
      }

      tocList.forEach(item => {
        const div = document.createElement('div');
        div.className = 'toc-item';
        div.innerText = item.title;
        div.onclick = () => {
          closeModal('modal-toc');
          const target = document.getElementById(item.id);
          if (target) target.scrollIntoView({ behavior: 'smooth' });
        };
        tocContainer.appendChild(div);
      });
    }

    // 책 열기
    function openBook(id) {
      const book = books.find(b => b.id === id);
      if (!book) return;
      currentBookId = id;
      renderParsedBookContent(book);
      switchScreen('reader');
    }

    /* -------------------------------------------------------------
       서재 탭 및 삭제 관리
    ------------------------------------------------------------- */
    function switchTab(tab) {
      activeTab = tab;
      document.getElementById('tab-reading').classList.toggle('active', tab === 'reading');
      document.getElementById('tab-finished').classList.toggle('active', tab === 'finished');
      renderLibrary();
    }

    function renderLibrary() {
      const container = document.getElementById('book-list-container');
      container.innerHTML = '';

      const filtered = books.filter(b => activeTab === 'finished' ? b.isFinished : !b.isFinished);

      if (filtered.length === 0) {
        container.innerHTML = `<div style="text-align:center; color:#777; margin-top:50px;">등록된 책이 없습니다.</div>`;
        return;
      }

      filtered.forEach(book => {
        const card = document.createElement('div');
        card.className = 'book-card';
        card.innerHTML = `
          <div class="book-info" onclick="openBook(${book.id})">
            <div class="book-name">${book.title}</div>
            <div class="book-meta">${book.createdAt} 등록</div>
          </div>
          <button class="delete-btn" onclick="deleteBook(${book.id})" title="삭제">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
          </button>
        `;
        container.appendChild(card);
      });
    }

    function deleteBook(id) {
      if (!confirm('이 책을 삭제하시겠습니까?')) return;
      books = books.filter(b => b.id !== id);
      localStorage.setItem('yeobaek_books', JSON.stringify(books));
      renderLibrary();
    }

    /* -------------------------------------------------------------
       스크롤 자동 감지 메뉴 숨김 & 스크롤 위치 저장
    ------------------------------------------------------------- */
    function handleScroll() {
      const area = document.getElementById('reader-scroll-area');
      const st = area.scrollTop;
      const menu = document.getElementById('floating-menu');

      // 스크롤 내리면 메뉴 숨김, 올리면 표시
      if (st > lastScrollTop && st > 50) {
        menu.classList.add('hidden');
      } else {
        menu.classList.remove('hidden');
      }
      lastScrollTop = st;

      // 현재 읽던 스크롤 위치 저장
      if (currentBookId) {
        const book = books.find(b => b.id === currentBookId);
        if (book) {
          book.scrollPos = st;
          // 바닥 근처 다 읽음 처리
          if (area.scrollHeight - st - area.clientHeight < 50) {
            book.isFinished = true;
          }
          localStorage.setItem('yeobaek_books', JSON.stringify(books));
        }
      }
    }

    /* -------------------------------------------------------------
       시스템 TTS 기능
    ------------------------------------------------------------- */
    function toggleTTS() {
      if (!('speechSynthesis' in window)) {
        alert('이 브라우저는 음성 읽기 기능을 지원하지 않습니다.');
        return;
      }

      if (window.speechSynthesis.speaking) {
        window.speechSynthesis.cancel();
        return;
      }

      const bodyText = document.getElementById('content-body').innerText;
      if (!bodyText) return;

      ttsUtterance = new SpeechSynthesisUtterance(bodyText);
      ttsUtterance.lang = 'ko-KR';
      ttsUtterance.rate = 1.0;

      window.speechSynthesis.speak(ttsUtterance);
    }

    /* -------------------------------------------------------------
       독서 스타일 설정
    ------------------------------------------------------------- */
    function setFont(type) {
      const body = document.getElementById('content-body');
      body.style.fontFamily = type === 'serif' ? '"Nanum Myeongjo", "Batang", serif' : '-apple-system, sans-serif';
    }

    function toggleBold() {
      isBold = !isBold;
      document.getElementById('content-body').style.fontWeight = isBold ? '700' : '400';
      document.getElementById('btn-bold').classList.toggle('active', isBold);
      document.getElementById('btn-bold').innerText = isBold ? 'ON' : 'OFF';
    }

    function changeFontSize(delta) {
      fontSize = Math.max(0.8, Math.min(2.0, fontSize + delta * 0.1));
      document.getElementById('content-body').style.fontSize = `${fontSize}rem`;
    }

    function setTheme(mode) {
      const reader = document.getElementById('screen-reader');
      if (mode === 'dark') {
        reader.style.background = '#121318';
        reader.style.color = '#c5c5c5';
      } else {
        reader.style.background = '#f7f4ed';
        reader.style.color = '#2c221e';
      }
    }
  </script>
</body>
</html>

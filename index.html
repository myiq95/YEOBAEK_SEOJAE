    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        sepia: {
                            50: '#fbf8f3',
                            100: '#f7f1e5',
                            200: '#efe3cd',
                            800: '#433422',
                            900: '#2d2317'

                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', '"Apple SD Gothic Neo"', '"Malgun Gothic"', 'sans-serif'],
                        batang: ['"KoPubWorld Batang"', '"Nanum Myeongjo"', '"Gowun Batang"', 'Batang', 'serif'],

    <style>
        /* Smooth Scrolling & Safe Area handling for iOS */
        html, body {
            height: 100%;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
            font-feature-settings: "palt";
        }

        .safe-pb {
            padding-bottom: env(safe-area-inset-bottom, 20px);
        }
        .safe-pt {
            padding-top: env(safe-area-inset-top, 20px);
        }

        /* Millennium Reader Dialogue Quote Styling */
        .reader-content blockquote.dialogue {
            margin: 1.25rem 0;
            padding: 0.85rem 1.25rem;
            border-left: 3px solid #ea580c;
            background: rgba(234, 88, 12, 0.05);
            border-radius: 0 12px 12px 0;
            font-style: normal;
        }

        .dark .reader-content blockquote.dialogue {
            background: rgba(234, 88, 12, 0.12);
            border-left-color: #f97316;
        }

        /* Reader Content Highlight mode */
        .highlight-mode .reader-content p::selection {
            background-color: #fef08a;
            color: #000;
        }
        
        .highlight-pen {
            background: linear-gradient(180deg, transparent 60%, rgba(253, 224, 71, 0.4) 60%);
        }

        /* Auto Hide Top & Bottom Bars Transition */
        .nav-bar-transition {
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Subtle Ambient Background Overlay */
        .bg-illustration {
            background-image: radial-gradient(circle at 50% 30%, rgba(234, 88, 12, 0.08) 0%, transparent 60%),
                              radial-gradient(circle at 80% 80%, rgba(120, 113, 108, 0.1) 0%, transparent 50%);
        }

        /* Custom Scrollbars */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(156, 163, 175, 0.4);
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 font-sans antialiased selection:bg-orange-500/30 selection:text-orange-200">

    <!-- MAIN APP SCRIPT LOGIC -->
    <script>
        /**
         * Yeobaek Reader Application Core Architecture
         */
        document.addEventListener('DOMContentLoaded', () => {
            // Initialize Lucide Icons
            lucide.createIcons();

            // Register Service Worker inline for PWA Offline Capability
            if ('serviceWorker' in navigator) {
                const swCode = `
                    self.addEventListener('install', e => self.skipWaiting());
                    self.addEventListener('activate', e => self.clients.claim());
                    self.addEventListener('fetch', e => e.respondWith(fetch(e.request).catch(() => new Response('Offline'))));
                `;
                const blob = new Blob([swCode], { type: 'application/javascript' });
                navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
            }

            // PDF.js worker setup
            if (window.pdfjsLib) {
                pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
            }

            // --- STATE MANAGEMENT ---
            const state = {
                books: [],          // Stored Book Objects
                currentBook: null,   // Active Book
                activeTab: 'reading',// 'reading' | 'completed'
                settings: {
                    theme: 'dark',
                    fontFamily: 'font-batang',
                    fontSize: 18,
                    lineHeight: 1.8,
                    letterSpacing: 0,
                    isBold: false,
                    isHighlightPen: false
                },
                tts: {
                    synth: window.speechSynthesis,
                    utterance: null,
                    isPlaying: false,
                    rate: 1.0
                },
                lastScrollTop: 0
            };

            // --- DOM ELEMENTS ---
            const views = {
                home: document.getElementById('view-home'),
                library: document.getElementById('view-library'),
                reader: document.getElementById('view-reader')
            };

            const readerContentEl = document.getElementById('reader-content');
            const readerScrollArea = document.getElementById('reader-scroll-area');
            const topBar = document.getElementById('reader-top-bar');
            const bottomBar = document.getElementById('reader-bottom-bar');

            // Initialize Storage
            loadFromStorage();
            renderLibraryList();

            // ==========================================
            // EVENT LISTENERS & NAVIGATION
            // ==========================================

            // Navigation Switcher
            function switchView(viewName) {
                Object.keys(views).forEach(v => {
                    if (v === viewName) {
                        views[v].classList.remove('hidden');

            document.getElementById('nav-go-library').addEventListener('click', () => {

            });

            document.getElementById('lib-back-home').addEventListener('click', () => {
                switchView('home');
            });

            document.getElementById('reader-close').addEventListener('click', () => {
                stopTTS();
                saveBookProgress();
                switchView('library');
                renderLibraryList();
            });

            // Dark Mode Theme Toggle on Home
            document.getElementById('btn-theme-toggle').addEventListener('click', () => {
                const isDark = document.documentElement.classList.toggle('dark');
                state.settings.theme = isDark ? 'dark' : 'light';

            // Library Tabs Switcher
            document.getElementById('tab-reading').addEventListener('click', (e) => {

            function updateTabUI(activeBtn, inactiveBtn) {
                activeBtn.className = "flex-1 py-3 text-center font-medium border-b-2 border-orange-500 text-orange-400 transition-colors";
                inactiveBtn.className = "flex-1 py-3 text-center font-medium border-b-2 border-transparent text-zinc-400 hover:text-zinc-200 transition-colors";
            }

            // Paste Text Modal Logic
            document.getElementById('nav-paste-txt').addEventListener('click', () => {

            });

            document.getElementById('paste-close').addEventListener('click', () => {

            });

            document.getElementById('paste-submit').addEventListener('click', () => {
                const title = document.getElementById('paste-title').value.trim() || '무제 붙여넣기 텍스트';
                const text = document.getElementById('paste-content').value.trim();
                if (!text) return alert('본문 내용을 입력해 주세요.');

                const newBook = createBookObject(title, text);
                state.books.unshift(newBook);
                saveToStorage();

                document.getElementById('paste-modal').classList.add('hidden');
                document.getElementById('paste-title').value = '';
                document.getElementById('paste-content').value = '';

            });

            // File Upload Event Handling (Both Home & Library File Inputs)
            [document.getElementById('file-input'), document.getElementById('lib-file-input')].forEach(input => {
                input.addEventListener('change', handleFileUpload);
            });

            async function handleFileUpload(e) {
                const file = e.target.files[0];
                if (!file) return;

                const fileName = file.name.replace(/\.[^/.]+$/, "");
                const ext = file.name.split('.').pop().toLowerCase();

                try {
                    let parsedText = "";

                    if (ext === 'txt' || ext === 'md' || ext === 'html' || ext === 'htm') {
                        parsedText = await readTextFileWithKoreanEncoding(file);
                    } else if (ext === 'docx') {
                        const arrayBuffer = await file.arrayBuffer();
                        const res = await mammoth.extractRawText({ arrayBuffer: arrayBuffer });
                        parsedText = res.value;
                    } else if (ext === 'pdf') {
                        parsedText = await parsePdfFile(file);
                    } else if (ext === 'epub') {
                        parsedText = await parseEpubFile(file);
                    } else {
                        alert('지원하지 않는 파일 형식입니다.');
                        return;
                    }

                    if (!parsedText || parsedText.trim().length === 0) {
                        alert('파일 내용이 없거나 텍스트 추출에 실패했습니다.');
                        return;
                    }

                    const newBook = createBookObject(fileName, parsedText);
                    state.books.unshift(newBook);
                    saveToStorage();
                    openBook(newBook.id);

                } catch (err) {
                    console.error(err);
                    alert('파일을 로드하는 동안 오류가 발생했습니다: ' + err.message);
                } finally {
                    e.target.value = ''; // Reset input
                }
            }

            // ==========================================
            // KOREAN ENCODING & PARSING ENGINE
            // ==========================================

            // Handles UTF-8, CP949, EUC-KR, ANSI Encoding Detection
            function readTextFileWithKoreanEncoding(file) {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const codes = new Uint8Array(e.target.result);
                        const detected = Encoding.detect(codes);
                        
                        let encodingName = 'UTF8';
                        if (detected === 'EUCKR' || detected === 'SJIS' || detected === 'CP949') {
                            encodingName = 'EUCKR';
                        }
                        
                        try {
                            const unicodeArray = Encoding.convert(codes, {
                                to: 'UNICODE',
                                from: encodingName
                            });
                            const text = Encoding.codeToString(unicodeArray);
                            resolve(text);
                        } catch (err) {
                            // Fallback TextDecoder
                            const decoder = new TextDecoder('euc-kr');
                            resolve(decoder.decode(codes));
                        }
                    };
                    reader.onerror = reject;
                    reader.readAsArrayBuffer(file);
                });
            }

            // PDF Korean Text Extraction Engine
            async function parsePdfFile(file) {
                const arrayBuffer = await file.arrayBuffer();
                const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                let fullText = "";

                for (let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const content = await page.getTextContent();
                    const pageStrings = content.items.map(item => item.str);
                    fullText += pageStrings.join(' ') + "\n\n";
                }
                return fullText;
            }

            // EPUB Reader Engine
            async function parseEpubFile(file) {
                const arrayBuffer = await file.arrayBuffer();
                const book = ePub(arrayBuffer);
                await book.ready;
                
                let fullText = "";
                const spine = book.spine;
                
                for (const item of spine.items) {
                    const doc = await item.load(book.load.bind(book));
                    if (doc && doc.querySelector) {
                        const body = doc.querySelector('body');
                        if (body) {
                            fullText += body.innerText + "\n\n";
                        }
                    }
                }
                return fullText;
            }

            // ==========================================
            // BOOK DATA & STORAGE
            // ==========================================

            function createBookObject(title, rawContent) {
                const toc = extractTableOfContents(rawContent);
                return {
                    id: 'book_' + Date.now(),
                    title: title,
                    content: rawContent,
                    toc: toc,
                    scrollPos: 0,
                    progress: 0,
                    isCompleted: false,
                    updatedAt: Date.now()
                };
            }

            function saveToStorage() {
                localStorage.setItem('yeobaek_books', JSON.stringify(state.books));
                localStorage.setItem('yeobaek_settings', JSON.stringify(state.settings));
            }

            function loadFromStorage() {
                const savedBooks = localStorage.getItem('yeobaek_books');
                if (savedBooks) {
                    try { state.books = JSON.parse(savedBooks); } catch (e) { state.books = []; }
                }
                const savedSettings = localStorage.getItem('yeobaek_settings');
                if (savedSettings) {
                    try { state.settings = { ...state.settings, ...JSON.parse(savedSettings) }; } catch (e) {}
                }
                applySettingsUI();
            }

            // Render Library Screen Items
            function renderLibraryList() {
                const listEl = document.getElementById('library-list');
                listEl.innerHTML = '';

                const filtered = state.books.filter(b => state.activeTab === 'completed' ? b.isCompleted : !b.isCompleted);

                // Update tab counts
                document.getElementById('count-reading').innerText = state.books.filter(b => !b.isCompleted).length;
                document.getElementById('count-completed').innerText = state.books.filter(b => b.isCompleted).length;

                if (filtered.length === 0) {
                    listEl.innerHTML = `
                        <div class="flex flex-col items-center justify-center py-20 text-center text-zinc-500">
                            <i data-lucide="book-open-check" class="w-12 h-12 mb-3 opacity-30"></i>
                            <p class="text-sm font-serif">보관된 책이 없습니다.</p>
                            <p class="text-xs text-zinc-600 mt-1">홈에서 파일이나 텍스트를 추가해 보세요.</p>
                        </div>
                    `;
                    lucide.createIcons();
                    return;
                }

                filtered.forEach(book => {
                    const card = document.createElement('div');
                    card.className = "bg-zinc-900/80 border border-zinc-800/80 rounded-2xl p-4 flex items-center justify-between hover:border-zinc-700 transition-all shadow-md group cursor-pointer";
                    
                    card.innerHTML = `
                        <div class="flex-1 pr-4 min-w-0" onclick="appOpenBook('${book.id}')">
                            <!-- Multi-line title wrap support (Up to 2 lines) -->
                            <h3 class="text-sm font-serif font-medium text-zinc-100 line-clamp-2 leading-snug mb-1 group-hover:text-orange-400 transition-colors">
                                ${escapeHtml(book.title)}
                            </h3>
                            <div class="flex items-center space-x-3 text-xs text-zinc-500 font-mono">
                                <span>진행률 ${book.progress}%</span>
                                <span>•</span>
                                <span>${new Date(book.updatedAt).toLocaleDateString()}</span>
                            </div>
                        </div>
                        <div class="flex items-center space-x-2">
                            <button onclick="appToggleComplete(event, '${book.id}')" class="p-2 text-zinc-500 hover:text-orange-400 rounded-full hover:bg-zinc-800" title="${book.isCompleted ? '읽는 중으로 변경' : '다 읽음 표시'}">
                                <i data-lucide="${book.isCompleted ? 'rotate-ccw' : 'check-circle'}" class="w-4 h-4"></i>
                            </button>
                            <button onclick="appDeleteBook(event, '${book.id}')" class="p-2 text-zinc-500 hover:text-red-400 rounded-full hover:bg-zinc-800" title="삭제">
                                <i data-lucide="trash-2" class="w-4 h-4"></i>
                            </button>
                        </div>
                    `;
                    listEl.appendChild(card);
                });

                lucide.createIcons();
            }

            // Expose globally for inline onclick
            window.appOpenBook = (id) => openBook(id);
            window.appDeleteBook = (e, id) => {
                e.stopPropagation();
                if (confirm('이 도서를 서재에서 삭제하시겠습니까?')) {
                    state.books = state.books.filter(b => b.id !== id);
                    saveToStorage();
                    renderLibraryList();
                }
            };
            window.appToggleComplete = (e, id) => {
                e.stopPropagation();
                const book = state.books.find(b => b.id === id);
                if (book) {
                    book.isCompleted = !book.isCompleted;
                    if (book.isCompleted) book.progress = 100;
                    saveToStorage();
                    renderLibraryList();
                }
            };

            // ==========================================
            // TABLE OF CONTENTS (목차) EXTRACTION LOGIC
            // ==========================================

            function extractTableOfContents(text) {
                const lines = text.split('\n');
                const toc = [];
                // Regex for Korean Novel Chapter logic: 제N장, 제N화, 챕터, Chapter, N화, [숫자]
                const chapterRegex = /^\s*(제\s*\d+\s*[장화절편목]|Chapter\s*\d+|\d+화|\d+\.\s+|[0-9]{1,3}\b)/i;

                lines.forEach((line, index) => {
                    const trimmed = line.trim();
                    if (trimmed.length > 0 && trimmed.length < 40 && chapterRegex.test(trimmed)) {
                        toc.push({
                            title: trimmed,
                            lineIndex: index
                        });
                    }
                });

                // Fallback TOC generation if no chapter patterns found
                if (toc.length === 0) {
                    const totalLines = lines.length;
                    const parts = 5;
                    for (let i = 0; i < parts; i++) {
                        const lIdx = Math.floor((totalLines / parts) * i);
                        toc.push({
                            title: `임의 목차 ${i + 1}부`,
                            lineIndex: lIdx
                        });
                    }
                }

                return toc;
            }

            // ==========================================
            // MILLENNIUM KOREAN READER & TYPOGRAPHY
            // ==========================================

            function openBook(bookId) {
                const book = state.books.find(b => b.id === bookId);
                if (!book) return;

                state.currentBook = book;
                switchView('reader');

                // Render Titles
                document.getElementById('reader-book-title').innerText = book.title;
                document.getElementById('content-header-title').innerText = book.title;

                // Render Content with Millennium Korean Formatting Rules
                renderFormattedBody(book.content);

                // Render TOC Drawer List
                renderTocDrawer(book.toc);

                // Restore Scroll Position
                setTimeout(() => {
                    if (book.scrollPos) {
                        readerScrollArea.scrollTop = book.scrollPos;
                    } else {
                        readerScrollArea.scrollTop = 0;
                    }
                    updateProgressUI();
                }, 50);
            }

            // Formats Korean Text: Dialogue callout blockquotes + Chapter Title Highlights + Paragraph spaces
            function renderFormattedBody(rawText) {
                readerContentEl.innerHTML = '';
                const lines = rawText.split('\n');
                const fragment = document.createDocumentFragment();

                const chapterRegex = /^\s*(제\s*\d+\s*[장화절편목]|Chapter\s*\d+|\d+화|\d+\.\s+)/i;
                const dialogueRegex = /^["'“‘].*["'”’]$/; // Lines enclosed in quote marks

                lines.forEach((line, idx) => {
                    const trimmed = line.trim();
                    if (!trimmed) return; // Skip empty spacing lines

                    if (chapterRegex.test(trimmed)) {
                        // Chapter Heading Block
                        const h2 = document.createElement('h2');
                        h2.id = `line-node-${idx}`;
                        h2.className = "text-xl font-serif font-bold text-orange-500 border-b border-orange-500/20 pb-2 mt-12 mb-6 tracking-wide";
                        h2.innerText = trimmed;
                        fragment.appendChild(h2);
                    } else if (dialogueRegex.test(trimmed)) {
                        // Dialogue Blockquote Box
                        const quote = document.createElement('blockquote');
                        quote.id = `line-node-${idx}`;
                        quote.className = "dialogue font-serif leading-relaxed text-zinc-100 my-4";
                        quote.innerText = trimmed;
                        fragment.appendChild(quote);
                    } else {
                        // Standard Paragraph Line
                        const p = document.createElement('p');
                        p.id = `line-node-${idx}`;
                        p.className = "font-serif leading-relaxed tracking-normal my-3 text-justify";
                        p.innerText = trimmed;
                        fragment.appendChild(p);
                    }
                });

                readerContentEl.appendChild(fragment);
                applySettingsUI();
            }

            function renderTocDrawer(tocList) {
                const container = document.getElementById('toc-list-container');
                container.innerHTML = '';

                tocList.forEach((item) => {
                    const btn = document.createElement('button');
                    btn.className = "w-full text-left py-2 px-3 rounded-lg hover:bg-zinc-800 text-zinc-300 font-serif text-xs truncate transition-colors";
                    btn.innerText = item.title;
                    btn.onclick = () => {
                        document.getElementById('toc-modal').classList.add('hidden');
                        const targetNode = document.getElementById(`line-node-${item.lineIndex}`);
                        if (targetNode) {
                            targetNode.scrollIntoView({ behavior: 'smooth' });
                        }
                    };
                    container.appendChild(btn);
                });
            }

            // ==========================================
            // AUTO HIDE MENU & PROGRESS CALCULATOR
            // ==========================================

            readerScrollArea.addEventListener('scroll', () => {
                const currentScroll = readerScrollArea.scrollTop;
                const maxScroll = readerScrollArea.scrollHeight - readerScrollArea.clientHeight;
                
                // Progress percentage calculation
                if (maxScroll > 0) {
                    const progress = Math.min(100, Math.max(0, Math.round((currentScroll / maxScroll) * 100)));
                    if (state.currentBook) {
                        state.currentBook.scrollPos = currentScroll;
                        state.currentBook.progress = progress;
                        if (progress >= 98) state.currentBook.isCompleted = true;
                    }
                    updateProgressUI();
                }

                // Scroll Direction Auto-Hiding Navbar (Reverse Scroll Shows)
                if (currentScroll > state.lastScrollTop && currentScroll > 80) {
                    // Scrolling Down: Hide Bars
                    topBar.style.transform = 'translateY(-100%)';
                    bottomBar.style.transform = 'translateY(100%)';
                } else {
                    // Reverse Scroll Up: Reveal Bars
                    topBar.style.transform = 'translateY(0)';
                    bottomBar.style.transform = 'translateY(0)';
                }
                state.lastScrollTop = currentScroll;
            });

            function updateProgressUI() {
                if (!state.currentBook) return;
                const p = state.currentBook.progress || 0;
                document.getElementById('reader-progress-percent').innerText = `${p}%`;
                document.getElementById('status-percentage').innerText = `${p}%`;
                document.getElementById('reader-progress-slider').value = p;
            }

            // Slider progress scrub
            document.getElementById('reader-progress-slider').addEventListener('input', (e) => {
                const val = e.target.value;
                const maxScroll = readerScrollArea.scrollHeight - readerScrollArea.clientHeight;
                readerScrollArea.scrollTop = (maxScroll * val) / 100;
            });

            function saveBookProgress() {
                if (state.currentBook) {
                    state.currentBook.updatedAt = Date.now();
                    saveToStorage();
                }
            }

            // ==========================================
            // SYSTEM TTS (WEB SPEECH SYNTHESIS) ENGINE
            // ==========================================

            const ttsPanel = document.getElementById('tts-control-panel');
            
            document.getElementById('btn-tts-toggle').addEventListener('click', () => {
                ttsPanel.classList.toggle('hidden');
            });

            document.getElementById('tts-close').addEventListener('click', () => {
                ttsPanel.classList.add('hidden');
            });

            document.getElementById('tts-btn-play').addEventListener('click', () => {
                if (state.tts.isPlaying) {
                    pauseTTS();
                } else {
                    playTTS();
                }
            });

            document.getElementById('tts-btn-stop').addEventListener('click', stopTTS);

            document.getElementById('tts-rate-slider').addEventListener('input', (e) => {
                state.tts.rate = parseFloat(e.target.value);
                document.getElementById('tts-rate-val').innerText = `${state.tts.rate}x`;
                if (state.tts.isPlaying) {
                    stopTTS();
                    playTTS();
                }
            });

            function playTTS() {
                if (!('speechSynthesis' in window)) {
                    alert('현재 브라우저/기기는 음성 읽기(TTS)를 지원하지 않습니다.');
                    return;
                }

                stopTTS();

                const textContent = readerContentEl.innerText;
                if (!textContent) return;

                state.tts.utterance = new SpeechSynthesisUtterance(textContent);
                state.tts.utterance.lang = 'ko-KR';
                state.tts.utterance.rate = state.tts.rate;

                state.tts.utterance.onend = () => {
                    state.tts.isPlaying = false;
                    updateTTSPlayBtn();
                };

                state.tts.synth.speak(state.tts.utterance);
                state.tts.isPlaying = true;
                updateTTSPlayBtn();
            }

            function pauseTTS() {
                if (state.tts.synth) {
                    state.tts.synth.pause();
                    state.tts.isPlaying = false;
                    updateTTSPlayBtn();
                }
            }

            function stopTTS() {
                if (state.tts.synth) {
                    state.tts.synth.cancel();
                    state.tts.isPlaying = false;
                    updateTTSPlayBtn();
                }
            }

            function updateTTSPlayBtn() {
                const playBtnIcon = document.getElementById('tts-btn-play');
                if (state.tts.isPlaying) {
                    playBtnIcon.innerHTML = `<i data-lucide="pause" class="w-5 h-5 fill-current"></i>`;
                } else {
                    playBtnIcon.innerHTML = `<i data-lucide="play" class="w-5 h-5 fill-current"></i>`;
                }
                lucide.createIcons();
            }

            // ==========================================
            // SETTINGS & TYPOGRAPHY MODAL LOGIC
            // ==========================================

            const settingsModal = document.getElementById('settings-modal');
            const tocModal = document.getElementById('toc-modal');

            document.getElementById('btn-style-settings').addEventListener('click', () => {
                settingsModal.classList.remove('hidden');
            });
            document.getElementById('settings-close').addEventListener('click', () => {
                settingsModal.classList.add('hidden');
            });

            document.getElementById('btn-toc').addEventListener('click', () => {
                tocModal.classList.remove('hidden');
            });
            document.getElementById('toc-close').addEventListener('click', () => {
                tocModal.classList.add('hidden');
            });

            // Theme Options Switcher
            document.querySelectorAll('.theme-opt').forEach(btn => {
                btn.addEventListener('click', () => {
                    const theme = btn.getAttribute('data-theme');
                    state.settings.theme = theme;
                    applyTheme(theme);
                    saveToStorage();
                });
            });

            function applyTheme(theme) {
                const readerView = views.reader;
                readerView.classList.remove('bg-zinc-950', 'bg-sepia-50', 'bg-white', 'text-zinc-200', 'text-sepia-900', 'text-zinc-900');

                if (theme === 'sepia') {
                    readerView.classList.add('bg-sepia-50', 'text-sepia-900');
                    document.documentElement.classList.remove('dark');
                } else if (theme === 'light') {
                    readerView.classList.add('bg-white', 'text-zinc-900');
                    document.documentElement.classList.remove('dark');
                } else {
                    readerView.classList.add('bg-zinc-950', 'text-zinc-200');
                    document.documentElement.classList.add('dark');
                }
            }

            // Font Family Control
            document.getElementById('setting-font-family').addEventListener('change', (e) => {
                state.settings.fontFamily = e.target.value;
                applySettingsUI();
                saveToStorage();
            });

            // Font Size Grow / Shrink
            document.getElementById('btn-font-grow').addEventListener('click', () => {
                if (state.settings.fontSize < 32) {
                    state.settings.fontSize += 1;
                    applySettingsUI();
                    saveToStorage();
                }
            });

            document.getElementById('btn-font-shrink').addEventListener('click', () => {
                if (state.settings.fontSize > 12) {
                    state.settings.fontSize -= 1;
                    applySettingsUI();
                    saveToStorage();
                }
            });

            // Line Height & Letter Spacing Controls
            document.getElementById('setting-line-height').addEventListener('input', (e) => {
                state.settings.lineHeight = parseFloat(e.target.value);
                applySettingsUI();
                saveToStorage();
            });

            document.getElementById('setting-letter-spacing').addEventListener('input', (e) => {
                state.settings.letterSpacing = parseFloat(e.target.value);
                applySettingsUI();
                saveToStorage();
            });

            // Bold & Highlight Pen Checkboxes
            document.getElementById('toggle-bold').addEventListener('change', (e) => {
                state.settings.isBold = e.target.checked;
                applySettingsUI();
                saveToStorage();
            });

            document.getElementById('toggle-highlight-pen').addEventListener('change', (e) => {
                state.settings.isHighlightPen = e.target.checked;
                applySettingsUI();
                saveToStorage();
            });

            function applySettingsUI() {
                // Apply theme
                applyTheme(state.settings.theme);

                // Update controls
                document.getElementById('font-size-val').innerText = `${state.settings.fontSize}px`;
                document.getElementById('setting-font-family').value = state.settings.fontFamily;
                document.getElementById('setting-line-height').value = state.settings.lineHeight;
                document.getElementById('setting-letter-spacing').value = state.settings.letterSpacing;
                document.getElementById('toggle-bold').checked = state.settings.isBold;
                document.getElementById('toggle-highlight-pen').checked = state.settings.isHighlightPen;

                // Apply Reader Text Styles
                readerContentEl.style.fontSize = `${state.settings.fontSize}px`;
                readerContentEl.style.lineHeight = state.settings.lineHeight;
                readerContentEl.style.letterSpacing = `${state.settings.letterSpacing}em`;
                readerContentEl.style.fontWeight = state.settings.isBold ? '700' : '400';

                // Font Family Classes
                readerContentEl.classList.remove('font-sans', 'font-batang', 'font-serif');
                readerContentEl.classList.add(state.settings.fontFamily);

                // Highlight Mode Toggle
                if (state.settings.isHighlightPen) {
                    readerContentEl.classList.add('highlight-mode');
                } else {
                    readerContentEl.classList.remove('highlight-mode');
                }
            }

            // HTML Escape Helper
            function escapeHtml(str) {
                return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
            }
        });
    </script>
</body>
</html>

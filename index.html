<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>여백 서재</title>
  
  <!-- PWA / iOS WebApp Meta -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#181a20">
  <link rel="apple-touch-icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512' fill='%232c3e50'><rect width='512' height='512' rx='120' fill='%231a1c23'/><path d='M160 120h192v272H160z' fill='%23d4af37' opacity='0.2'/><path d='M180 140h152v232H180z' fill='%23f4efe6'/><path d='M210 180h92M210 220h92M210 260h60' stroke='%234a3b32' stroke-width='12' stroke-linecap='round'/></svg>">

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&display=swap" rel="stylesheet">

  <!-- Parsers -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #181a20 0%, #242834 50%, #1a1c24 100%);
      --text-main: #2c221e;
      --reader-bg: #f7f4ed;
      --accent: #c5a059;
      --safe-top: env(safe-area-inset-top, 20px);
      --safe-bottom: env(safe-area-inset-bottom, 20px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100dvh;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      overflow: hidden;
      background: #121318;
      color: #fff;
    }

    .app-screen {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100dvh;
      display: none;
      flex-direction: column;
      opacity: 0;
      transition: opacity 0.25s ease;
      background: var(--bg-gradient);
    }

    .app-screen.active {
      display: flex;
      opacity: 1;
      z-index: 10;
    }

    /* 1. 초기 화면 (홈) */
    #screen-home {
      justify-content: space-between;
      align-items: center;
      padding: calc(var(--safe-top) + 20px) 24px calc(var(--safe-bottom) + 30px);
      text-align: center;
      background: radial-gradient(circle at 50% 30%, #2d3245 0%, #15171e 80%);
    }

    .app-title {
      font-family: "Nanum Myeongjo", "Batang", serif;
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      color: #f3ece0;
    }

    .app-subtitle {
      font-size: 0.85rem;
      letter-spacing: 0.3em;
      color: var(--accent);
      margin-top: 6px;
      text-transform: uppercase;
    }

    .illustration-container {
      width: 100%;
      max-width: 300px;
      height: 40vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .home-nav-bar {
      display: flex;
      gap: 20px;
      background: rgba(255, 255, 255, 0.08);
      padding: 10px 24px;
      border-radius: 40px;
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.12);
    }

    .icon-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      background: rgba(255, 255, 255, 0.1);
      color: #f0e6d2;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .icon-btn svg { width: 20px; height: 20px; fill: currentColor; }

    /* 2. 서재 화면 */
    #screen-library {
      padding: calc(var(--safe-top) + 15px) 20px calc(var(--safe-bottom) + 20px);
      background: linear-gradient(180deg, #1e222d 0%, #14161d 100%);
    }

    .library-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .tab-bar {
      display: flex;
      background: rgba(0, 0, 0, 0.3);
      padding: 4px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      border: none;
      background: transparent;
      color: #8a8f9d;
      font-size: 0.9rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
    }

    .tab-btn.active { background: rgba(255, 255, 255, 0.12); color: #fff; }

    .book-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }

    .book-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .book-name {
      font-size: 1.05rem;
      font-weight: 600;
      color: #e6dfd5;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* 3. 독서 본문 화면 (전체화면 적용) */
    #screen-reader {
      background: var(--reader-bg);
      color: var(--text-main);
      position: relative;
    }

    .reader-scroll-area {
      width: 100%;
      height: 100dvh;
      overflow-y: auto;
      padding: calc(var(--safe-top) + 20px) 20px calc(var(--safe-bottom) + 80px);
      scroll-behavior: smooth;
      position: relative;
      z-index: 2;
    }

    .reader-bg-artwork {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      opacity: 0.15;
      pointer-events: none;
      z-index: 1;
      background: radial-gradient(circle at 80% 20%, #dfb76c 0%, transparent 40%),
                  radial-gradient(circle at 20% 80%, #3a415a 0%, transparent 50%);
    }

    .content-body {
      position: relative;
      z-index: 3;
      max-width: 680px;
      margin: 0 auto;
      line-height: 1.85;
      font-size: 1.1rem;
      word-break: break-word;
    }

    .content-body p { margin-bottom: 1.4em; text-align: justify; }

    .content-body .chapter-heading {
      font-size: 1.35rem;
      font-weight: 700;
      margin: 2.2em 0 1em;
      border-left: 4px solid var(--accent);
      padding-left: 12px;
      color: inherit;
    }

    .content-body blockquote.dialogue {
      margin: 1.2em 0;
      padding: 10px 16px;
      background: rgba(197, 160, 89, 0.12);
      border-left: 3px solid var(--accent);
      border-radius: 0 8px 8px 0;
      font-weight: 500;
    }

    /* 슬림 하단 플로팅 메뉴 & 진행률 바 */
    .floating-menu-wrapper {
      position: absolute;
      bottom: calc(var(--safe-bottom) + 10px);
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      z-index: 100;
      transition: transform 0.3s ease, opacity 0.3s ease;
    }

    .floating-menu-wrapper.hidden {
      transform: translate(-50%, 90px);
      opacity: 0;
      pointer-events: none;
    }

    .progress-pill {
      background: rgba(20, 20, 25, 0.85);
      color: var(--accent);
      font-size: 0.72rem;
      padding: 3px 10px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
    }

    .floating-menu {
      display: flex;
      gap: 12px;
      background: rgba(20, 20, 25, 0.92);
      padding: 6px 16px;
      border-radius: 25px;
      backdrop-filter: blur(15px);
      border: 1px solid rgba(255,255,255,0.15);
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    }

    .floating-menu .icon-btn {
      width: 38px;
      height: 38px;
      background: rgba(255, 255, 255, 0.08);
    }

    .floating-menu .icon-btn svg { width: 18px; height: 18px; }

    /* 모달 레이어 */
    .modal-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.6);
      display: none;
      justify-content: center;
      align-items: flex-end;
      z-index: 200;
    }

    .modal-overlay.active { display: flex; }

    .modal-card {
      width: 100%;
      max-width: 500px;
      background: #222530;
      border-radius: 24px 24px 0 0;
      padding: 24px 24px calc(var(--safe-bottom) + 24px);
      color: #fff;
      max-height: 80vh;
      overflow-y: auto;
    }

    .setting-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .setting-label { font-size: 0.95rem; color: #ccc; }

    .btn-group { display: flex; gap: 8px; }

    .opt-btn {
      padding: 6px 14px;
      border: 1px solid rgba(255,255,255,0.2);
      background: transparent;
      color: #fff;
      border-radius: 8px;
      cursor: pointer;
    }

    .opt-btn.active {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
    }

    .paste-textarea {
      width: 100%;
      height: 180px;
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 12px;
      color: #fff;
      resize: none;
      margin: 12px 0;
    }

    .toc-item { padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); cursor: pointer; }
    #file-input { display: none; }
  </style>
</head>
<body>

  <!-- 홈 화면 -->
  <div id="screen-home" class="app-screen active">
    <div>
      <h1 class="app-title">여백 서재</h1>
      <div class="app-subtitle">Yeobaek Seojae</div>
    </div>

    <div class="illustration-container">
      <svg viewBox="0 0 320 400" fill="none" style="width:100%; height:100%;">
        <path d="M40 380 V160 A120 120 0 0 1 280 160 V380 Z" fill="#2d3245" stroke="#c5a059" stroke-width="2"/>
        <circle cx="160" cy="140" r="45" fill="#f4efe6" opacity="0.8"/>
        <line x1="70" y1="260" x2="250" y2="260" stroke="#c5a059" stroke-width="3"/>
      </svg>
    </div>

    <div class="home-nav-bar">
      <button class="icon-btn" onclick="switchScreen('library')"><svg viewBox="0 0 24 24"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H8V4h12v12z"/></svg></button>
      <button class="icon-btn" onclick="document.getElementById('file-input').click()"><svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg></button>
      <button class="icon-btn" onclick="openModal('modal-paste')"><svg viewBox="0 0 24 24"><path d="M19 2h-4.18C14.4 1.84 13.3 1 12 1c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm7 18H5V4h2v3h10V4h2v16z"/></svg></button>
    </div>
  </div>

  <input type="file" id="file-input" accept=".txt,.docx,.pdf,.epub,.md,.html" onchange="handleFileUpload(event)">

  <!-- 서재 화면 -->
  <div id="screen-library" class="app-screen">
    <div class="library-header">
      <button class="icon-btn" onclick="switchScreen('home')"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg></button>
      <div style="font-size:1.3rem; font-weight:bold;">나의 서재</div>
      <button class="icon-btn" onclick="document.getElementById('file-input').click()"><svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg></button>
    </div>
    <div class="tab-bar">
      <button id="tab-reading" class="tab-btn active" onclick="switchTab('reading')">읽고 있는 책</button>
      <button id="tab-finished" class="tab-btn" onclick="switchTab('finished')">다 읽은 책</button>
    </div>
    <div id="book-list-container" class="book-list"></div>
  </div>

  <!-- 독서 화면 -->
  <div id="screen-reader" class="app-screen">
    <div class="reader-bg-artwork"></div>
    <div id="reader-scroll-area" class="reader-scroll-area" onscroll="handleScroll()">
      <div id="content-body" class="content-body"></div>
    </div>

    <!-- 하단 메뉴 및 독서 진행률 바 -->
    <div id="floating-menu-wrapper" class="floating-menu-wrapper">
      <div id="progress-indicator" class="progress-pill">0%</div>
      <div class="floating-menu">
        <button class="icon-btn" onclick="switchScreen('library')"><svg viewBox="0 0 24 24"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H8V4h12v12z"/></svg></button>
        <button class="icon-btn" onclick="openModal('modal-toc')"><svg viewBox="0 0 24 24"><path d="M3 9h14V7H3v2zm0 4h14v-2H3v2zm0 4h14v-2H3v2zm16 0h2v-2h-2v2zm0-10v2h2V7h-2zm0 6h2v-2h-2v2z"/></svg></button>
        <button class="icon-btn" onclick="toggleTTS()"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg></button>
        <button class="icon-btn" onclick="openModal('modal-settings')"><svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg></button>
      </div>
    </div>
  </div>

  <!-- 붙여넣기 모달 -->
  <div id="modal-paste" class="modal-overlay">
    <div class="modal-card">
      <h3 style="margin-bottom:12px; color:var(--accent);">텍스트 붙여넣기</h3>
      <input type="text" id="paste-title" placeholder="제목을 입력하세요" style="width:100%; padding:10px; background:rgba(0,0,0,0.3); border:1px solid #444; border-radius:8px; color:#fff; margin-bottom:8px;">
      <textarea id="paste-content" class="paste-textarea" placeholder="여기에 소설이나 문서 내용을 붙여넣으세요..."></textarea>
      <div style="display:flex; gap:10px; justify-content:flex-end;">
        <button class="opt-btn" onclick="closeModal('modal-paste')">취소</button>
        <button class="opt-btn active" onclick="savePastedText()">등록 및 읽기</button>
      </div>
    </div>
  </div>

  <!-- 독서 설정 모달 -->
  <div id="modal-settings" class="modal-overlay">
    <div class="modal-card">
      <h3 style="margin-bottom:16px; color:var(--accent);">독서 환경 설정</h3>
      <div class="setting-row">
        <span class="setting-label">글꼴</span>
        <div class="btn-group">
          <button id="btn-font-sans" class="opt-btn active" onclick="setFont('sans')">고딕</button>
          <button id="btn-font-serif" class="opt-btn" onclick="setFont('serif')">명조</button>
        </div>
      </div>
      <div class="setting-row">
        <span class="setting-label">굵은 글씨 (볼드)</span>
        <div class="btn-group">
          <button id="btn-bold" class="opt-btn" onclick="toggleBold()">OFF</button>
        </div>
      </div>
      <div class="setting-row">
        <span class="setting-label">글자 크기</span>
        <div class="btn-group">
          <button class="opt-btn" onclick="changeFontSize(-1)">A-</button>
          <button class="opt-btn" onclick="changeFontSize(1)">A+</button>
        </div>
      </div>
      <div class="setting-row">
        <span class="setting-label">테마 모드</span>
        <div class="btn-group">
          <button id="btn-theme-light" class="opt-btn active" onclick="setTheme('light')">밝음</button>
          <button id="btn-theme-dark" class="opt-btn" onclick="setTheme('dark')">나이트</button>
        </div>
      </div>
      <div style="text-align:right; margin-top:20px;">
        <button class="opt-btn active" onclick="closeModal('modal-settings')">닫기</button>
      </div>
    </div>
  </div>

  <!-- 목차 모달 -->
  <div id="modal-toc" class="modal-overlay">
    <div class="modal-card">
      <h3 style="margin-bottom:16px; color:var(--accent);">목차</h3>
      <div id="toc-list" style="max-height:50vh; overflow-y:auto;"></div>
      <div style="text-align:right; margin-top:16px;">
        <button class="opt-btn" onclick="closeModal('modal-toc')">닫기</button>
      </div>
    </div>
  </div>

  <script>
    if (window.pdfjsLib) {
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }

    let books = JSON.parse(localStorage.getItem('yeobaek_books') || '[]');
    let currentBookId = null;
    let activeTab = 'reading';
    let lastScrollTop = 0;
    let isBold = false;
    let fontSize = 1.1;

    function switchScreen(id) {
      document.querySelectorAll('.app-screen').forEach(s => s.classList.remove('active'));
      document.getElementById(`screen-${id}`).classList.add('active');
      if (id === 'library') renderLibrary();
      if (id !== 'reader' && window.speechSynthesis) window.speechSynthesis.cancel();
    }

    function openModal(id) { document.getElementById(id).classList.add('active'); }
    function closeModal(id) { document.getElementById(id).classList.remove('active'); }

    async function handleFileUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const title = file.name.replace(/\.[^/.]+$/, "");
      let rawText = "";

      try {
        const ext = file.name.split('.').pop().toLowerCase();

        if (ext === 'txt' || ext === 'md' || ext === 'html') {
          const buffer = await file.arrayBuffer();
          try {
            rawText = new TextDecoder('utf-8', { fatal: true }).decode(buffer);
          } catch (e) {
            rawText = new TextDecoder('euc-kr').decode(buffer);
          }
          if (ext === 'html' || ext === 'md') {
            const doc = new DOMParser().parseFromString(rawText, 'text/html');
            rawText = doc.body.innerText || doc.body.textContent;
          }
        } else if (ext === 'pdf') {
          const buffer = await file.arrayBuffer();
          if (window.pdfjsLib) {
            const pdf = await pdfjsLib.getDocument({ data: buffer }).promise;
            for (let i = 1; i <= pdf.numPages; i++) {
              const page = await pdf.getPage(i);
              const textContent = await page.getTextContent();
              textContent.items.forEach(item => { rawText += item.str + " "; });
              rawText += "\n\n";
            }
          } else {
            rawText = new TextDecoder('utf-8').decode(buffer).replace(/[^\uAC00-\uD7A3\s0-9a-zA-Z.,!?]/g, ' ');
          }
        } else if (ext === 'docx') {
          const buffer = await file.arrayBuffer();
          if (window.mammoth) {
            const result = await mammoth.extractRawText({ arrayBuffer: buffer });
            rawText = result.value;
          }
        } else if (ext === 'epub') {
          const buffer = await file.arrayBuffer();
          if (window.JSZip) {
            const zip = await JSZip.loadAsync(buffer);
            for (let filename of Object.keys(zip.files)) {
              if (filename.endsWith('.html') || filename.endsWith('.xhtml') || filename.endsWith('.htm')) {
                const htmlContent = await zip.files[filename].async('text');
                const doc = new DOMParser().parseFromString(htmlContent, 'text/html');
                rawText += (doc.body.innerText || doc.body.textContent) + "\n\n";
              }
            }
          }
        }

        if (!rawText || !rawText.trim()) {
          alert('본문 내용을 로드하지 못했습니다.');
          return;
        }

        saveBookToLibrary(title, rawText);
      } catch (err) {
        alert('파일을 열 수 없습니다: ' + err.message);
      } finally {
        event.target.value = '';
      }
    }

    function savePastedText() {
      const title = document.getElementById('paste-title').value.trim() || '무제 문서';
      const content = document.getElementById('paste-content').value.trim();
      if (!content) { alert('내용을 입력해 주세요.'); return; }
      saveBookToLibrary(title, content);
      closeModal('modal-paste');
      document.getElementById('paste-title').value = '';
      document.getElementById('paste-content').value = '';
    }

    function saveBookToLibrary(title, rawText) {
      const newBook = {
        id: Date.now(),
        title: title,
        content: rawText,
        scrollPos: 0,
        isFinished: false,
        createdAt: new Date().toLocaleDateString()
      };
      books.unshift(newBook);
      localStorage.setItem('yeobaek_books', JSON.stringify(books));
      openBook(newBook.id);
    }

    function openBook(id) {
      const book = books.find(b => b.id === id);
      if (!book) return;
      currentBookId = id;
      renderParsedBookContent(book);
      switchScreen('reader');
    }

    function renderParsedBookContent(book) {
      const container = document.getElementById('content-body');
      container.innerHTML = `<h1 style="text-align:center; margin-bottom:1.5em; font-size:1.6rem; border-bottom:2px solid var(--accent); padding-bottom:0.5em;">${book.title}</h1>`;

      const lines = book.content.split(/\r?\n/);
      let tocList = [];

      // 고도화된 목차 인식 정규식 Engine
      const chapterRegex = /^\s*(제\s*[\d０-９一二三四五六七八九十백천]+\s*[장화회편권부절기억토막]|CHAPTER\s*\d+|CHAP\.?\s*\d+|\d+\s*화|\d+\s*회|[\d０-９]+\s*\.\s+\S+|^\d+$|\[\d+\]|\(\d+\)|\b(프롤로그|에필로그|서문|머리말|맺음말|후기|prologue|epilogue)\b)/i;

      lines.forEach((line, index) => {
        const trimmed = line.trim();
        if (!trimmed) return;

        if (chapterRegex.test(trimmed)) {
          const chapEl = document.createElement('h2');
          chapEl.className = 'chapter-heading';
          chapEl.id = `chap-${index}`;
          chapEl.innerText = trimmed;
          container.appendChild(chapEl);
          tocList.push({ title: trimmed, id: `chap-${index}` });
        } else if (/^["'“‘].*["'”’]$/.test(trimmed)) {
          const quoteEl = document.createElement('blockquote');
          quoteEl.className = 'dialogue';
          quoteEl.innerText = trimmed;
          container.appendChild(quoteEl);
        } else {
          const pEl = document.createElement('p');
          pEl.innerText = trimmed;
          container.appendChild(pEl);
        }
      });

      renderTOC(tocList);

      setTimeout(() => {
        const scrollArea = document.getElementById('reader-scroll-area');
        scrollArea.scrollTop = book.scrollPos || 0;
      }, 100);
    }

    function renderTOC(tocList) {
      const tocContainer = document.getElementById('toc-list');
      tocContainer.innerHTML = tocList.length === 0 ? '<div style="color:#888; text-align:center; padding:20px;">자동 감지된 목차가 없습니다.</div>' : '';
      tocList.forEach(item => {
        const div = document.createElement('div');
        div.className = 'toc-item';
        div.innerText = item.title;
        div.onclick = () => {
          closeModal('modal-toc');
          document.getElementById(item.id)?.scrollIntoView({ behavior: 'smooth' });
        };
        tocContainer.appendChild(div);
      });
    }

    function switchTab(tab) {
      activeTab = tab;
      document.getElementById('tab-reading').classList.toggle('active', tab === 'reading');
      document.getElementById('tab-finished').classList.toggle('active', tab === 'finished');
      renderLibrary();
    }

    function renderLibrary() {
      const container = document.getElementById('book-list-container');
      container.innerHTML = '';
      const filtered = books.filter(b => activeTab === 'finished' ? b.isFinished : !b.isFinished);

      if (filtered.length === 0) {
        container.innerHTML = '<div style="text-align:center; color:#777; margin-top:50px;">등록된 책이 없습니다.</div>';
        return;
      }

      filtered.forEach(book => {
        const card = document.createElement('div');
        card.className = 'book-card';
        card.innerHTML = `
          <div style="flex:1;" onclick="openBook(${book.id})">
            <div class="book-name">${book.title}</div>
            <div style="font-size:0.75rem; color:#888; margin-top:4px;">${book.createdAt} 등록</div>
          </div>
          <button onclick="deleteBook(${book.id})" style="background:none; border:none; color:#ff6b6b; padding:8px;">삭제</button>
        `;
        container.appendChild(card);
      });
    }

    function deleteBook(id) {
      if (!confirm('정말 삭제하시겠습니까?')) return;
      books = books.filter(b => b.id !== id);
      localStorage.setItem('yeobaek_books', JSON.stringify(books));
      renderLibrary();
    }

    // 스크롤 및 독서 진행률 업데이트
    function handleScroll() {
      const area = document.getElementById('reader-scroll-area');
      const st = area.scrollTop;
      const maxScroll = area.scrollHeight - area.clientHeight;
      const wrapper = document.getElementById('floating-menu-wrapper');

      if (st > lastScrollTop && st > 50) wrapper.classList.add('hidden');
      else wrapper.classList.remove('hidden');
      lastScrollTop = st;

      const progress = maxScroll > 0 ? Math.min(100, Math.round((st / maxScroll) * 100)) : 0;
      document.getElementById('progress-indicator').innerText = `${progress}%`;

      if (currentBookId) {
        const book = books.find(b => b.id === currentBookId);
        if (book) {
          book.scrollPos = st;
          if (progress >= 98) book.isFinished = true;
          localStorage.setItem('yeobaek_books', JSON.stringify(books));
        }
      }
    }

    function toggleTTS() {
      if (!('speechSynthesis' in window)) {
        alert('음성 읽기를 지원하지 않는 브라우저입니다.');
        return;
      }
      if (window.speechSynthesis.speaking) {
        window.speechSynthesis.cancel();
        return;
      }
      const text = document.getElementById('content-body').innerText;
      if (!text) return;
      const utt = new SpeechSynthesisUtterance(text);
      utt.lang = 'ko-KR';
      window.speechSynthesis.speak(utt);
    }

    /* 설정 기능 로직 */
    function setFont(type) {
      const body = document.getElementById('content-body');
      body.style.fontFamily = type === 'serif' ? '"Nanum Myeongjo", "Batang", serif' : '-apple-system, sans-serif';
      document.getElementById('btn-font-sans').classList.toggle('active', type === 'sans');
      document.getElementById('btn-font-serif').classList.toggle('active', type === 'serif');
    }

    function toggleBold() {
      isBold = !isBold;
      document.getElementById('content-body').style.fontWeight = isBold ? '700' : '400';
      const btn = document.getElementById('btn-bold');
      btn.classList.toggle('active', isBold);
      btn.innerText = isBold ? 'ON' : 'OFF';
    }

    function changeFontSize(delta) {
      fontSize = Math.max(0.8, Math.min(2.0, fontSize + delta * 0.1));
      document.getElementById('content-body').style.fontSize = `${fontSize}rem`;
    }

    function setTheme(mode) {
      const reader = document.getElementById('screen-reader');
      const isDark = mode === 'dark';
      reader.style.background = isDark ? '#121318' : '#f7f4ed';
      reader.style.color = isDark ? '#c5c5c5' : '#2c221e';
      document.getElementById('btn-theme-light').classList.toggle('active', !isDark);
      document.getElementById('btn-theme-dark').classList.toggle('active', isDark);
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <title>여백 서재 - Yeobaek Seojae</title>

  <!-- iOS PWA Settings -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="여백 서재">
  <meta name="theme-color" content="#121212">

  <!-- Dynamic PWA Manifest Generator -->
  <script>
    const manifest = {
      name: "여백 서재",
      short_name: "여백",
      start_url: "./index.html",
      display: "standalone",
      background_color: "#121212",
      theme_color: "#121212",
      icons: [{
        src: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512' fill='%23121212'><rect width='512' height='512' rx='100' fill='%231a1a1e'/><path d='M160 120h140c30 0 50 20 50 50v170c0 30-20 50-50 50H160z' fill='%232a2a30'/><path d='M180 140h120c20 0 35 15 35 35v150c0 20-15 35-35 35H180z' fill='%23d4af37' opacity='0.85'/><path d='M210 200h80M210 240h80M210 280h50' stroke='%23121212' stroke-width='12' stroke-linecap='round'/></svg>",
        sizes: "512x512",
        type: "image/svg+xml",
        purpose: "any maskable"
      }]
    };
    const stringManifest = JSON.stringify(manifest);
    const blob = new Blob([stringManifest], {type: 'application/json'});
    const manifestURL = URL.createObjectURL(blob);
    const link = document.createElement('link');
    link.rel = 'manifest';
    link.href = manifestURL;
    document.head.appendChild(link);
  </script>

  <!-- Apple Touch Icon -->
  <link rel="apple-touch-icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='100' fill='%231a1a1e'/><path d='M160 120h140c30 0 50 20 50 50v170c0 30-20 50-50 50H160z' fill='%232a2a30'/><path d='M180 140h120c20 0 35 15 35 35v150c0 20-15 35-35 35H180z' fill='%23d4af37' opacity='0.85'/><path d='M210 200h80M210 240h80M210 280h50' stroke='%23121212' stroke-width='12' stroke-linecap='round'/></svg>">

  <!-- Tailwind CSS & Lucide Icons & Encoding Libraries -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/encoding-japanese@2.0.0/encoding.min.js"></script>

  <!-- Document Parsing Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <script>pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';</script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;600;700&family=Nanum+Myeongjo:wght@400;700&display=swap');

    :root {
      --app-font: 'Noto Serif KR', -apple-system, BlinkMacSystemFont, serif;
    }

    body {
      font-family: var(--app-font);
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      background-color: #121212;
      color: #e5e5e5;
    }

    /* Safe Area iOS Utils */
    .pt-safe { padding-top: max(1.25rem, env(safe-area-inset-top)); }
    .pb-safe { padding-bottom: max(1.25rem, env(safe-area-inset-bottom)); }
    .top-safe { top: env(safe-area-inset-top, 0px); }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 4px; }

    /* Millennium Typography & Dialogue Formatting */
    .reader-dialogue {
      display: block;
      margin: 1.25rem 0;
      padding: 0.85rem 1.15rem;
      border-left: 3px solid #d4af37;
      background: rgba(212, 175, 55, 0.05);
      border-radius: 0 8px 8px 0;
      font-weight: 500;
    }

    .reader-chapter {
      margin-top: 3.5rem;
      margin-bottom: 1.75rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid rgba(212, 175, 55, 0.25);
      font-size: 1.6em;
      font-weight: 700;
      color: #d4af37;
      letter-spacing: -0.02em;
    }

    .reader-paragraph {
      margin-bottom: 1.4rem;
      line-height: var(--reader-line-height, 1.8);
      letter-spacing: var(--reader-letter-spacing, 0px);
      font-size: var(--reader-font-size, 18px);
      text-align: justify;
      word-break: keep-all;
    }

    /* Auto-Hide Navigation Transition */
    .nav-bar-transition {
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .nav-hidden {
      transform: translateY(-120%);
    }

    /* Theme Styles */
    .theme-dark { background-color: #121212; color: #e0e0e0; }
    .theme-sepia { background-color: #f4ecd8; color: #423629; }
    .theme-light { background-color: #f8f9fa; color: #212529; }
    .theme-night { background-color: #050505; color: #888888; }

    /* Artwork Overlay Background */
    .bg-illustration {
      background-image: radial-gradient(circle at 50% 30%, rgba(212, 175, 55, 0.08) 0%, transparent 70%),
                        linear-gradient(to bottom, rgba(18, 18, 18, 0.75), rgba(18, 18, 18, 0.95));
    }
  </style>
</head>
<body class="h-screen w-screen overflow-hidden bg-[#121212] text-gray-200 flex flex-col">

  <!-- Hidden File Input -->
  <input type="file" id="file-input" class="hidden" accept=".txt,.md,.html,.epub,.docx,.pdf" onchange="handleFileSelect(event)">

    <!-- 1. HOME SCREEN VIEW -->

        <h3 class="text-lg font-bold text-amber-100 font-serif">독서 설정</h3>
        <button onclick="toggleSettingsModal()" class="text-gray-400 hover:text-white"><i data-lucide="x"></i></button>

      <!-- Theme Selector -->
      <div class="space-y-2">
        <label class="text-xs font-semibold text-gray-400">테마 선택</label>

          <button onclick="setTheme('sepia')" class="py-2.5 rounded-xl border border-amber-900/30 bg-[#f4ecd8] text-[#423629] text-xs font-medium">세피아</button>

            <span id="label-font-size">18px</span>
          </div>

          <div class="flex justify-between text-xs text-gray-400 mb-1">

          </div>

          <option value="-apple-system, BlinkMacSystemFont, sans-serif">iOS 산세리프 (System UI)</option>
          <option value="AppleSDGothicNeo-Regular, sans-serif">애플 고딕 (Apple SD Gothic Neo)</option>
          <option value="Times New Roman, serif">Times New Roman</option>

  <!-- APPLICATION LOGIC & CORE ENGINE -->
  <script>
    // State Management
    let db = JSON.parse(localStorage.getItem('yeobaek_books') || '[]');
    let currentBookId = null;
    let activeTab = 'reading';
    let lastScrollY = 0;
    let ttsUtterance = null;
    let isTTSPlaying = false;

    // Settings State
    let settings = JSON.parse(localStorage.getItem('yeobaek_settings') || JSON.stringify({
      theme: 'dark',
      fontSize: 18,
      lineHeight: 1.8,
      letterSpacing: 0,
      fontFamily: "'Noto Serif KR', serif"
    }));

    // Init App
    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      applySettings();
      renderLibrary();
      setupScrollListener();
    });

    // View Switching Logic
    function showView(viewName) {
      document.getElementById('view-home').classList.add('hidden');
      document.getElementById('view-library').classList.add('hidden');
      document.getElementById('view-reader').classList.add('hidden');

      const bg = document.getElementById('app-bg');
      if(viewName === 'reader') {
        bg.classList.add('opacity-30');
      } else {
        bg.classList.remove('opacity-30');
      }

      document.getElementById(`view-${viewName}`).classList.remove('hidden');
      if(viewName === 'library') renderLibrary();
    }

    // Modal Control Functions
    function openPasteModal() { document.getElementById('modal-paste').classList.remove('hidden'); }
    function closePasteModal() { document.getElementById('modal-paste').classList.add('hidden'); }
    function toggleTocModal() { document.getElementById('modal-toc').classList.toggle('hidden'); }
    function toggleSettingsModal() { document.getElementById('modal-settings').classList.toggle('hidden'); }

    // Multi-Encoding File Reader Utility
    async function readFileContent(file) {
      const arrayBuffer = await file.arrayBuffer();
      const uint8Array = new Uint8Array(arrayBuffer);
      
      // Auto-detect character encoding (UTF-8, CP949/EUC-KR, ANSI)
      const detectedEncoding = Encoding.detect(uint8Array);
      let encoding = 'UTF-8';
      if (detectedEncoding === 'EUCKR' || detectedEncoding === 'SJIS') {
        encoding = 'CP949';
      }

      const decoder = new TextDecoder(encoding);
      return decoder.decode(uint8Array);
    }

    // Main File Upload Controller
    async function handleFileSelect(event) {
      const file = event.target.files[0];
      if (!file) return;

      const title = file.name.replace(/\.[^/.]+$/, "");
      const ext = file.name.split('.').pop().toLowerCase();
      let rawText = "";

      try {
        if (ext === 'txt' || ext === 'md' || ext === 'html') {
          rawText = await readFileContent(file);
          if (ext === 'html') {
            const doc = new DOMParser().parseFromString(rawText, 'text/html');
            rawText = doc.body.innerText || doc.body.textContent;
          }
        } else if (ext === 'docx') {
          const arrayBuffer = await file.arrayBuffer();
          const result = await mammoth.extractRawText({ arrayBuffer: arrayBuffer });
          rawText = result.value;
        } else if (ext === 'pdf') {
          const arrayBuffer = await file.arrayBuffer();
          const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
          let pdfText = "";
          for (let i = 1; i <= pdf.numPages; i++) {
            const page = await pdf.getPage(i);
            const tokenized = await page.getTextContent();
            const pageText = tokenized.items.map(item => item.str).join(" ");
            pdfText += pageText + "\n\n";
          }
          rawText = pdfText;
        } else if (ext === 'epub') {
          const arrayBuffer = await file.arrayBuffer();
          const zip = await JSZip.loadAsync(arrayBuffer);
          let epubText = "";
          for (let filename of Object.keys(zip.files)) {
            if (filename.endsWith('.html') || filename.endsWith('.xhtml')) {
              const htmlContent = await zip.files[filename].async('string');
              const doc = new DOMParser().parseFromString(htmlContent, 'text/html');
              epubText += (doc.body.innerText || doc.body.textContent) + "\n\n";
            }
          }
          rawText = epubText;
        }

        if (rawText.trim().length === 0) {
          alert('텍스트를 불러올 수 없거나 빈 파일입니다.');
          return;
        }

        saveAndOpenBook(title, rawText);
      } catch (err) {
        console.error(err);
        alert('파일을 읽는 중 오류가 발생했습니다.');
      }
    }

    // Manual Paste Entry Handler
    function savePastedText() {
      const title = document.getElementById('paste-title').value.trim() || '무제 노트';
      const content = document.getElementById('paste-content').value.trim();

      if (!content) {
        alert('본문 내용을 입력해주세요.');
        return;
      }

      closePasteModal();
      document.getElementById('paste-title').value = '';
      document.getElementById('paste-content').value = '';
      saveAndOpenBook(title, content);
    }

    // Save Book to Local Storage & Launch Reader View
    function saveAndOpenBook(title, rawText) {
      const chapters = parseChaptersAndFormatting(rawText);
      const newBook = {
        id: Date.now(),
        title: title,
        chapters: chapters,
        rawText: rawText,
        scrollPosition: 0,
        isCompleted: false,
        updatedAt: new Date().toISOString()
      };

      db.unshift(newBook);
      saveDB();
      openBook(newBook.id);
    }

    // Modern Millennium Formatting & Chapter Pattern Parser
    function parseChaptersAndFormatting(text) {
      const lines = text.split(/\r?\n/);
      const chapters = [];
      let currentChapter = { title: "도입", content: [] };

      // Korean Chapter Heading Detection Logic Regex
      const chapterRegex = /^(제\s*\d+\s*[장화|편|절|막]|chapter\s*\d+|\d+화|\d+장|[0-9]+\.)/i;

      lines.forEach(line => {
        const trimmed = line.trim();
        if (!trimmed) return;

        if (chapterRegex.test(trimmed) && trimmed.length < 40) {
          if (currentChapter.content.length > 0) {
            chapters.push(currentChapter);
          }
          currentChapter = { title: trimmed, content: [] };
        } else {
          // Process Dialogues (Wrapped in Quotes)
          const isDialogue = /^["'“‘].*["'”’]$/.test(trimmed);
          currentChapter.content.push({
            text: trimmed,
            isDialogue: isDialogue
          });
        }
      });

      if (currentChapter.content.length > 0) {
        chapters.push(currentChapter);
      }

      return chapters.length > 0 ? chapters : [{ title: "본문", content: lines.map(l => ({ text: l, isDialogue: /^["'“‘].*["'”’]$/.test(l.trim()) })) }];
    }

    // Library Rendering Engine
    function switchLibraryTab(tab) {
      activeTab = tab;
      document.getElementById('tab-reading').className = tab === 'reading' 
        ? "flex-1 py-2 text-sm font-medium rounded-lg transition-all bg-amber-500/20 text-amber-300 shadow"
        : "flex-1 py-2 text-sm font-medium rounded-lg transition-all text-gray-400 hover:text-gray-200";
      document.getElementById('tab-completed').className = tab === 'completed'
        ? "flex-1 py-2 text-sm font-medium rounded-lg transition-all bg-amber-500/20 text-amber-300 shadow"
        : "flex-1 py-2 text-sm font-medium rounded-lg transition-all text-gray-400 hover:text-gray-200";
      renderLibrary();
    }

    function renderLibrary() {
      const listContainer = document.getElementById('library-list');
      listContainer.innerHTML = '';

      const filtered = db.filter(b => activeTab === 'completed' ? b.isCompleted : !b.isCompleted);

      if (filtered.length === 0) {
        listContainer.innerHTML = `
          <div class="h-64 flex flex-col items-center justify-center text-gray-500 text-sm">
            <i data-lucide="book-open-check" class="w-10 h-10 mb-2 stroke-1"></i>
            <span>보관된 도서가 없습니다.</span>
          </div>
        `;
        lucide.createIcons();
        return;
      }

      filtered.forEach(book => {
        const item = document.createElement('div');
        item.className = "bg-white/5 border border-white/10 rounded-2xl p-4 flex justify-between items-center hover:bg-white/10 transition group";
        item.innerHTML = `
          <div class="flex-1 pr-4 cursor-pointer" onclick="openBook(${book.id})">
            <!-- 2-Line Support for Long Book Titles -->
            <h4 class="font-serif font-bold text-amber-100 line-clamp-2 leading-snug">${escapeHtml(book.title)}</h4>
            <span class="text-xs text-gray-400 mt-1 block">${new Date(book.updatedAt).toLocaleDateString()}</span>
          </div>
          <div class="flex items-center gap-2">
            <button onclick="toggleCompleteBook(event, ${book.id})" title="완독 표시" class="p-2 text-gray-400 hover:text-amber-400 rounded-lg">
              <i data-lucide="${book.isCompleted ? 'check-circle-2' : 'circle'}" class="w-5 h-5"></i>
            </button>
            <button onclick="deleteBook(event, ${book.id})" title="삭제" class="p-2 text-gray-400 hover:text-red-400 rounded-lg">
              <i data-lucide="trash-2" class="w-5 h-5"></i>
            </button>
          </div>
        `;
        listContainer.appendChild(item);
      });

      lucide.createIcons();
    }

    // Open & Render Reader View
    function openBook(id) {
      const book = db.find(b => b.id === id);
      if (!book) return;

      currentBookId = id;
      document.getElementById('reader-book-title').innerText = book.title;

      const viewer = document.getElementById('viewer-content');
      const tocList = document.getElementById('toc-list');
      viewer.innerHTML = '';
      tocList.innerHTML = '';

      // Build TOC & Document Flow
      book.chapters.forEach((chap, idx) => {
        const chapId = `chap-${idx}`;
        
        // TOC Menu Item
        const tocItem = document.createElement('button');
        tocItem.className = "w-full text-left py-2 px-3 rounded-lg hover:bg-white/10 text-sm text-gray-300 truncate";
        tocItem.innerText = chap.title;
        tocItem.onclick = () => {
          toggleTocModal();
          document.getElementById(chapId)?.scrollIntoView({ behavior: 'smooth' });
        };
        tocList.appendChild(tocItem);

        // Reader Chapter Title
        const chapTitleEl = document.createElement('h3');
        chapTitleEl.id = chapId;
        chapTitleEl.className = "reader-chapter";
        chapTitleEl.innerText = chap.title;
        viewer.appendChild(chapTitleEl);

        // Paragraphs & Dialogues
        chap.content.forEach(p => {
          const paragraph = document.createElement('p');
          if (p.isDialogue) {
            paragraph.className = "reader-dialogue";
          } else {
            paragraph.className = "reader-paragraph";
          }
          paragraph.innerText = p.text;
          viewer.appendChild(paragraph);
        });
      });

      showView('reader');

      // Restore Last Scroll Position
      setTimeout(() => {
        const container = document.getElementById('reader-scroll-container');
        container.scrollTop = book.scrollPosition || 0;
      }, 50);
    }

    // Scroll Listener for Auto-Hiding Menu & Position Save
    function setupScrollListener() {
      const container = document.getElementById('reader-scroll-container');
      const topNav = document.getElementById('reader-top-nav');

      container.addEventListener('scroll', () => {
        const currentScrollY = container.scrollTop;

        // Auto-Hide Top Navigation Logic (Hide on Scroll Down, Show on Scroll Up)
        if (currentScrollY > lastScrollY && currentScrollY > 80) {
          topNav.classList.add('nav-hidden');
        } else {
          topNav.classList.remove('nav-hidden');
        }
        lastScrollY = currentScrollY;

        // Save Scroll Position to DB
        if (currentBookId) {
          const book = db.find(b => b.id === currentBookId);
          if (book) {
            book.scrollPosition = currentScrollY;
            saveDB();
          }
        }
      });
    }

    // System Voice Speech (iOS Web Speech API TTS Integration)
    function toggleTTS() {
      if (!('speechSynthesis' in window)) {
        alert('이 기기에서는 음성 읽기(TTS)를 지원하지 않습니다.');
        return;
      }

      const btn = document.getElementById('tts-btn');

      if (isTTSPlaying) {
        window.speechSynthesis.cancel();
        isTTSPlaying = false;
        btn.classList.remove('text-amber-400');
        return;
      }

      const viewer = document.getElementById('viewer-content');
      const textToRead = viewer.innerText;

      if (!textToRead) return;

      ttsUtterance = new SpeechSynthesisUtterance(textToRead);
      ttsUtterance.lang = 'ko-KR';
      ttsUtterance.rate = 0.95;

      ttsUtterance.onend = () => {
        isTTSPlaying = false;
        btn.classList.remove('text-amber-400');
      };

      window.speechSynthesis.speak(ttsUtterance);
      isTTSPlaying = true;
      btn.classList.add('text-amber-400');
    }

    // Book Management Actions
    function toggleCompleteBook(e, id) {
      e.stopPropagation();
      const book = db.find(b => b.id === id);
      if (book) {
        book.isCompleted = !book.isCompleted;
        saveDB();
        renderLibrary();
      }
    }

    function deleteBook(e, id) {
      e.stopPropagation();
      if (confirm('이 책을 서재에서 삭제하시겠습니까?')) {
        db = db.filter(b => b.id !== id);
        saveDB();
        renderLibrary();
      }
    }

    function saveDB() {
      localStorage.setItem('yeobaek_books', JSON.stringify(db));
    }

    // Reader Customization Engine
    function setTheme(theme) {
      settings.theme = theme;
      saveSettings();
      const container = document.getElementById('reader-scroll-container');
      container.className = `flex-1 w-full h-full overflow-y-auto px-6 pt-24 pb-20 theme-${theme} transition-colors duration-300`;
    }

    function updateStyle(prop, val) {
      settings[prop] = val;
      saveSettings();
      applySettings();
    }

    function applySettings() {
      const root = document.documentElement;
      root.style.setProperty('--reader-font-size', `${settings.fontSize}px`);
      root.style.setProperty('--reader-line-height', settings.lineHeight);
      root.style.setProperty('--reader-letter-spacing', `${settings.letterSpacing}px`);
      root.style.setProperty('--app-font', settings.fontFamily);

      document.getElementById('label-font-size').innerText = `${settings.fontSize}px`;
      document.getElementById('label-line-height').innerText = settings.lineHeight;
      document.getElementById('label-letter-spacing').innerText = `${settings.letterSpacing}px`;

      setTheme(settings.theme);
    }

    function saveSettings() {
      localStorage.setItem('yeobaek_settings', JSON.stringify(settings));
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    // Offline Service Worker Registration for PWA Support
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        const swCode = `
          self.addEventListener('install', e => self.skipWaiting());
          self.addEventListener('fetch', e => e.respondWith(fetch(e.request).catch(() => caches.match(e.request))));
        `;
        const blob = new Blob([swCode], { type: 'application/javascript' });
        navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
      });
    }
  </script>
</body>
</html>
